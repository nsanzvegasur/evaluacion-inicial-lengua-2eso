name: Ajuste descarga resultados

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quitar-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar botón CSV de resultados
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '    st.download_button("📄 Descargar CSV", data=st.session_state.resultado_csv, file_name=f"resultado_{fila[\'name\']}.csv", mime="text/csv", use_container_width=True)\n'
          if old in s:
              s = s.replace(old, '')
          else:
              raise SystemExit('No se encontró el botón CSV; no se modifica app.py')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio y eliminar este workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajuste-descarga-excel.yml
          git add app.py
          git commit -m "Eliminar descarga CSV y mantener Excel"
          git push
